<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>BOMB DEFUSAL</title>

  <!--
  ╔══════════════════════════════════════════════════════════╗
  ║  セットアップ手順                                         ║
  ║                                                          ║
  ║  1. console.firebase.google.com でプロジェクトを作成      ║
  ║  2. Realtime Database を追加（テストモードで作成でOK）     ║
  ║  3. プロジェクトの設定 → firebaseConfig をコピー           ║
  ║  4. 下の firebaseConfig の中身を貼り付ける                ║
  ║  5. SECRET_CODE を解除コードに書き換える                  ║
  ║     （文化祭前日夜に書き換えてアップロードするだけでOK）   ║
  ║  6. index.html にも同じ firebaseConfig を貼り付ける       ║
  ║                                                          ║
  ║  Firebase Database ルール（テスト用）                     ║
  ║  {                                                       ║
  ║    "rules": { ".read": true, ".write": true }            ║
  ║  }                                                       ║
  ╚══════════════════════════════════════════════════════════╝
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <!-- 爆発画面のデジタル表示フォントを先読み（同一サーバー上の同梱ファイル。
       爆発の瞬間に読み込み待ちが発生しないようにする） -->
  <link rel="preload" as="font" type="font/woff2"
        href="fonts/PressStart2P-Regular.woff2" crossorigin>

  <style>
    /* アーケード筐体風のドット表示フォント Press Start 2P
       （SIL Open Font License 1.1、(c) 2012 CodeMan38 /
         fonts/PressStart2P-LICENSE.txt）。
       端末にインストールされている必要がないよう、リポジトリに同梱した
       ファイルを同一サーバーから配信する＝実機で別フォントに化けない。 */
    @font-face {
      font-family: 'Press Start 2P';
      src: url('fonts/PressStart2P-Regular.woff2') format('woff2'),
           url('fonts/PressStart2P-Regular.woff')  format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: block;   /* 読込中に別フォントで一瞬表示されるのを防ぐ */
    }

    /* ─── Tokens ─── */
    :root {
      --red:    #FF2222;
      --red-bg: #0D0000;
      --red-bd: #550000;
      --green:  #00FF88;
      --orange: #FF8800;
      --ent-bg: #002800;
      --ent-bd: #007A40;
      --ent-tx: #00DD66;
    }

    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden; background: #000;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
    }

    /* ─── Portrait block ─── */
    #rotate-screen {
      display: none;
      position: fixed; inset: 0; z-index: 9999;
      background: #000;
      flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
    }
    #rotate-screen .icon  { font-size: 14vw; animation: rotHint 2s ease-in-out infinite; }
    #rotate-screen .label { font-size: 5vw; color: #FF3333; letter-spacing: 3px; }
    #rotate-screen .sub   { font-size: 2.5vw; color: #333; }
    @keyframes rotHint { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(90deg)} }

    @media (orientation: portrait) {
      #rotate-screen { display: flex; }
      #game-root, #ambient-glow { display: none; }
    }

    /* ─── Ambient glow ─── */
    /* Signature element: red vignette pulses faster as time runs out */
    #ambient-glow {
      position: fixed; inset: 0; z-index: 5; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 28%, rgba(200,0,0,0.55) 100%);
      opacity: 0; transition: opacity 0.8s;
    }
    #ambient-glow.warn   { opacity: 1; animation: gPulse 2s ease-in-out infinite; }
    #ambient-glow.danger { opacity: 1; animation: gPulse 0.35s ease-in-out infinite; }
    @keyframes gPulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

    /* ─── Wrong flash (ミス時の画面フラッシュ) ─── */
    #wrong-flash {
      position: fixed; inset: 0; z-index: 95; pointer-events: none;
      background: rgba(255, 50, 50, 0.8);
      display: none;
      animation: wrongFlash 0.4s ease-out;
    }
    #wrong-flash.show { display: block; }
    @keyframes wrongFlash {
      0%   { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ─── Game root ─── */
    #game-root {
      display: flex; flex-direction: column;
      width: 100vw; height: 100vh;
      background: #000;
    }

    /* ─── Timer ─── */
    #timer-wrap {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: center;
      padding: 1.2vh 0;
      min-height: 30vh;
    }
    #timer {
      font-family: 'VT323', monospace;
      font-size: clamp(120px, 35vh, 280px);
      line-height: 1; letter-spacing: 0.04em;
      color: var(--red);
      text-shadow: 0 0 14px rgba(255,0,0,0.9), 0 0 50px rgba(255,0,0,0.25);
      transition: color 0.3s, text-shadow 0.3s;
    }
    #timer.blink { animation: tBlink 0.45s step-end infinite; }
    #timer.green {
      color: var(--green);
      text-shadow: 0 0 14px rgba(0,255,136,0.9), 0 0 50px rgba(0,255,136,0.25);
    }
    @keyframes tBlink { 0%,100%{opacity:1} 50%{opacity:0.18} }

    /* ─── Code display ─── */
    #code-wrap {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: center;
      gap: clamp(10px, 2.5vw, 22px);
      padding: 0.6vh 0;
    }
    .dbox {
      width:  clamp(46px, 8.5vw, 80px);
      height: clamp(52px,  9.5vh, 86px);
      border: 2px solid var(--red-bd);
      background: var(--red-bg);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'VT323', monospace;
      font-size: clamp(32px, 7.5vh, 62px);
      color: var(--red);
      text-shadow: 0 0 8px rgba(255,0,0,0.45);
      transition: border-color 0.12s;
    }
    .dbox.filled { border-color: var(--red); }
    .dbox.pop    { animation: dPop 0.13s ease-out; }
    @keyframes dPop { 0%{transform:scale(1.22)} 100%{transform:scale(1)} }

    /* ─── Attempts warning ─── */
    #warn-wrap {
      flex: 0 0 auto; height: 3.5vh;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(10px, 1.8vh, 15px);
      color: var(--orange); letter-spacing: 3px;
      opacity: 0; transition: opacity 0.4s;
    }
    #warn-wrap.show { opacity: 1; }

    /* ─── Wrong indicator (ミス表示) ─── */
    #wrong-indicator {
      flex: 0 0 auto; height: 4vh;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(14px, 2.2vh, 18px);
      color: #FF4444; letter-spacing: 2px;
      opacity: 0; transition: opacity 0.3s;
      font-weight: bold;
    }
    #wrong-indicator.show { opacity: 1; animation: wrongPulse 0.5s ease-in-out; }
    @keyframes wrongPulse {
      0%   { transform: scale(0.8); opacity: 0; }
      50%  { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ─── Numpad ─── */
    #numpad-wrap {
      flex: 1 1 auto;
      display: flex; align-items: center; justify-content: center;
      padding: 0.5vh 0 2.5vh;
    }
    #numpad {
      display: grid;
      grid-template-columns: repeat(3, clamp(62px, 15.5vw, 128px));
      grid-template-rows:    repeat(4, clamp(44px,  9.5vh,  84px));
      gap: clamp(6px, 1.2vh, 11px) clamp(8px, 1.4vw, 13px);
    }
    .kbtn {
      background: var(--red-bg);
      border: 1.5px solid var(--red-bd);
      color: #FF5555;
      font-family: 'Share Tech Mono', monospace;
      font-size: clamp(20px, 4.5vh, 38px);
      font-weight: 700;
      border-radius: 7px;
      cursor: pointer; touch-action: manipulation;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.07s, border-color 0.07s, transform 0.05s;
    }
    .kbtn:active { background: #1E0000; border-color: var(--red); transform: scale(0.91); }
    .kbtn.del { font-size: clamp(16px, 3.8vh, 30px); color: #FF8888; }
    .kbtn.ent {
      background: var(--ent-bg); border-color: var(--ent-bd); color: var(--ent-tx);
      font-size: clamp(12px, 2.7vh, 22px); letter-spacing: 1px;
    }
    .kbtn.ent:active { background: #003818; border-color: var(--green); }

    /* ─── Overlays base ─── */
    .ov {
      position: fixed; inset: 0; z-index: 100;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .ov.show { display: flex; }

    /* standby */
    #ov-standby { background: #000; }
    .sb-txt {
      font-size: clamp(12px, 2.8vh, 22px);
      color: #252525; letter-spacing: 8px;
      animation: sbPulse 2.5s ease-in-out infinite;
    }
    @keyframes sbPulse { 0%,100%{opacity:0.25} 50%{opacity:0.9} }

    /* confirm */
    #ov-confirm { background: rgba(0,0,0,0.97); }
    .cfm-box {
      border: 1.5px solid var(--red); border-radius: 14px;
      padding: 3.5vh 6vw; background: #070000;
      text-align: center; max-width: 90vw;
    }
    .cfm-title {
      font-size: clamp(13px, 3vh, 24px);
      color: #FF7777; letter-spacing: 3px; margin-bottom: 2vh;
    }
    .cfm-code {
      font-family: 'VT323', monospace;
      font-size: clamp(40px, 10vh, 80px);
      color: var(--red); letter-spacing: 0.28em;
      text-shadow: 0 0 10px rgba(255,0,0,0.4);
      margin-bottom: 3.5vh;
    }
    .cfm-btns { display: flex; gap: 4vw; justify-content: center; }
    .cfm-btn {
      padding: 1.4vh 5vw;
      font-family: inherit; font-size: clamp(12px, 2.5vh, 20px);
      font-weight: 700; border-radius: 7px;
      cursor: pointer; touch-action: manipulation; letter-spacing: 2px;
      transition: all 0.09s;
    }
    .cfm-btn:active { transform: scale(0.92); }
    #btn-no  { background: #111; border: 1.5px solid #444; color: #888; }
    #btn-yes { background: var(--ent-bg); border: 1.5px solid var(--ent-bd); color: var(--ent-tx); }

    /* checking */
    #ov-checking { background: #000; }
    .chk-txt { font-size: clamp(18px, 5.5vh, 44px); color: #AAAAEE; letter-spacing: 5px; }
    #chk-dots { display: inline-block; width: 3ch; text-align: left; }

    /* ─── success ───────────────────────────────────────────────
       蛍光緑の全面表示。爆発画面（赤の点滅＋白文字）と正反対の配色にして、
       遠くからでも一瞬で「成功した」と分かるようにする。 */
    #ov-success {
      text-align: center; overflow: hidden;
      background: #00FF7A;
      animation: sucPulseBg 0.9s ease-in-out infinite;
    }
    @keyframes sucPulseBg {
      0%,100% { background: #00FF7A; }
      50%     { background: #86FFC0; }
    }
    /* 切り替わった瞬間に中央から白い光が広がる（1回だけ） */
    #ov-success::before {
      content: ''; position: absolute; inset: -60%;
      background: radial-gradient(circle at center,
                  rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 55%);
      animation: sucBurst 1s ease-out forwards;
      pointer-events: none;
    }
    @keyframes sucBurst {
      0%   { transform: scale(0.15); opacity: 1; }
      100% { transform: scale(1.7);  opacity: 0; }
    }

    /* 「解除成功!!」は横幅・縦幅の小さい方を基準にサイズを決めるため、
       iPadの画面比が変わってもはみ出さない */
    .suc-main {
      position: relative;
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP',
                   'Yu Gothic', sans-serif;
      font-weight: 900;
      font-size: min(19vw, 40vh);
      line-height: 1.05; white-space: nowrap; letter-spacing: 0;
      color: #033D1D;
      text-shadow: 0 0 30px rgba(255,255,255,0.95), 0 0 90px rgba(255,255,255,0.6);
      animation: sucPop 0.55s cubic-bezier(0.2, 1.5, 0.4, 1) both;
    }
    @keyframes sucPop {
      0%   { transform: scale(0.5);  opacity: 0; }
      70%  { transform: scale(1.07); opacity: 1; }
      100% { transform: scale(1);    opacity: 1; }
    }

    .suc-time {
      position: relative;
      font-size: clamp(13px, 2.8vh, 24px);
      font-weight: 700; color: #033D1D; opacity: 0.8;
      letter-spacing: 4px; margin-top: 2.4vh;
    }

    /* explosion */
    #ov-explosion { animation: expFlash 0.22s step-end infinite; text-align: center; }
    @keyframes expFlash { 0%,100%{background:#CC0000} 50%{background:#FF1111} }
    /* 「GAME OVER」を画面いっぱいに表示する。GAME / OVER の2行積みにすることで
       横幅だけでなく縦幅も使い切る。横幅・縦幅の小さい方を基準にサイズを決める
       ため、iPadの横画面でも文字が画面からはみ出さない */
    .exp-main {
      font-family: 'Press Start 2P', 'Share Tech Mono', monospace;
      font-weight: normal;
      font-size: min(24vw, 46vh);
      line-height: 1; white-space: nowrap; letter-spacing: 0;
      color: #FFF;
      text-shadow: 0 0 24px #FF8800, 0 0 60px #FF4400;
    }

    /* ─── Firebase status indicator ─── */
    #firebase-status {
      position: fixed; bottom: 8px; right: 8px; z-index: 10;
      width: 12px; height: 12px; border-radius: 50%;
      background: #666; transition: background 0.3s;
    }
    #firebase-status.connected { background: #00FF88; box-shadow: 0 0 8px rgba(0,255,136,0.6); }
    #firebase-status.disconnected { background: #FF4444; box-shadow: 0 0 8px rgba(255,68,68,0.6); animation: statusBlink 1s ease-in-out infinite; }
    @keyframes statusBlink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  </style>
</head>
<body>

<!-- Portrait block -->
<div id="rotate-screen">
  <div class="icon">📱</div>
  <div class="label">横向きにしてください</div>
  <div class="sub">ROTATE DEVICE TO LANDSCAPE</div>
</div>

<!-- Ambient glow (signature element) -->
<div id="ambient-glow"></div>

<!-- Wrong flash -->
<div id="wrong-flash"></div>

<!-- ═══ MAIN GAME ═══ -->
<div id="game-root">

  <div id="timer-wrap">
    <div id="timer">--:--</div>
  </div>

  <div id="code-wrap">
    <div class="dbox" id="d0"></div>
    <div class="dbox" id="d1"></div>
    <div class="dbox" id="d2"></div>
    <div class="dbox" id="d3"></div>
  </div>

  <div id="warn-wrap">⚠&nbsp; 残り1回</div>
  <div id="wrong-indicator"></div>

  <div id="numpad-wrap">
    <div id="numpad">
      <button class="kbtn" data-v="1">1</button>
      <button class="kbtn" data-v="2">2</button>
      <button class="kbtn" data-v="3">3</button>
      <button class="kbtn" data-v="4">4</button>
      <button class="kbtn" data-v="5">5</button>
      <button class="kbtn" data-v="6">6</button>
      <button class="kbtn" data-v="7">7</button>
      <button class="kbtn" data-v="8">8</button>
      <button class="kbtn" data-v="9">9</button>
      <button class="kbtn del" data-v="back">←</button>
      <button class="kbtn" data-v="0">0</button>
      <button class="kbtn ent" data-v="enter">ENT</button>
    </div>
  </div>

</div>

<!-- Firebase status indicator -->
<div id="firebase-status"></div>

<!-- ═══ OVERLAYS ═══ -->
<div class="ov show" id="ov-standby">
  <div class="sb-txt">// STANDBY //</div>
</div>

<div class="ov" id="ov-confirm">
  <div class="cfm-box">
    <div class="cfm-title">よろしいですか？</div>
    <div class="cfm-code" id="cfm-code"></div>
    <div class="cfm-btns">
      <button class="cfm-btn" id="btn-no">← いいえ</button>
      <button class="cfm-btn" id="btn-yes">はい</button>
    </div>
  </div>
</div>

<div class="ov" id="ov-checking">
  <div class="chk-txt">CHECKING<span id="chk-dots">...</span></div>
</div>

<div class="ov" id="ov-success">
  <div class="suc-main">解除成功!!</div>
  <div class="suc-time" id="suc-time"></div>
</div>

<div class="ov" id="ov-explosion">
  <div class="exp-main">GAME<br>OVER</div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
// ╔══════════════════════════════════════════════════════╗
// ★ 解除コード（前日夜にここだけ書き換えてアップロード）  ★
// ╚══════════════════════════════════════════════════════╝
const SECRET_CODE = "6272";

// ╔══════════════════════════════════════════════════════╗
// ★ Firebase Config（index.html と同じものを貼り付け）   ★
// ╚══════════════════════════════════════════════════════╝
const firebaseConfig = {
    apiKey: "AIzaSyDlvOh0Am1vQLC4RyrOpkmseu_nx4vF0kE",
    authDomain: "countdown-a04be.firebaseapp.com",
    databaseURL: "https://countdown-a04be-default-rtdb.firebaseio.com",
    projectId: "countdown-a04be",
    storageBucket: "countdown-a04be.firebasestorage.app",
    messagingSenderId: "724179810638",
    appId: "1:724179810638:web:b09efd4bd277f03f45861f",
    measurementId: "G-T2GPLE7CQG"
  };

// ── Firebase init ──
if (firebaseConfig.apiKey === "YOUR_API_KEY") {
  // Config がまだ未設定の場合のフォールバック表示
  document.getElementById('ov-standby').innerHTML =
    '<div style="color:#FF5555;font-size:clamp(11px,2vh,18px);text-align:center;padding:24px;letter-spacing:2px;line-height:2.2">' +
    '⚠ Firebase 未設定<br>bomb.html の<br>firebaseConfig を<br>設定してください</div>';
} else {
  firebase.initializeApp(firebaseConfig);
  const gameRef = firebase.database().ref('game');
  const connRef = firebase.database().ref('.info/connected');
  initGame(gameRef, connRef);
}

function initGame(gameRef, connRef) {

  // ──────────── State ────────────
  let gameState     = 'idle';
  let inputCode     = '';
  let wrongAttempts = 0;
  let timeRemaining = 0;
  let timerInterval = null;
  let isLocked      = false;
  let checkTimeout = null;   // 「確認中」の判定タイマー（リセット時に取消）

  // 保留中のタイマーを取消（リセット・爆発時の誤発火防止）
  function clearPendingTimers() {
    if (checkTimeout) { clearTimeout(checkTimeout); checkTimeout = null; }
  }

  // ──────────── Audio ────────────
  let audioCtx  = null;
  let droneNodes = null;   // 爆発時の重低音ドローン
  let dotsLoop  = null;

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  // 画面のどこを触っても音声を解錠（遠隔起動のため、キーパッド以外の
  // タッチでもアラームが鳴るように。timeout爆発の無音化を防ぐ）
  document.addEventListener('pointerdown', initAudio, { passive: true });

  function tone(freq, dur, type, vol) {
    if (!audioCtx) return;
    try {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = type || 'square';
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.start(audioCtx.currentTime);
      o.stop(audioCtx.currentTime + dur);
    } catch(e) {}
  }

  const sndClick   = () => tone(1400, 0.04, 'sine', 0.08);
  const sndBeep    = () => tone(880,  0.07, 'square', 0.18);
  const sndWrong   = () => tone(180,  0.35, 'sawtooth', 0.25);
  const sndWrongAlert = () => {
    // ミス時の警告音：低い音を3回
    for (let i = 0; i < 3; i++) {
      setTimeout(() => tone(220, 0.15, 'square', 0.3), i * 200);
    }
  };
  // 成功時の「ピコーン♪」。Web Audioで生成するので外部音源は増やさない。
  // 一瞬で駆け上がる「ピコ」＋澄んだ余韻の「ーン」の2段構成。
  // 1ゲームにつき1回だけ鳴らす（sucSoundDone は開始/リセットで戻す）。
  let sucSoundDone = false;
  const sndSuccess = () => {
    if (sucSoundDone) return;
    sucSoundDone = true;
    initAudio();
    if (!audioCtx) return;
    try {
      const t0 = audioCtx.currentTime;
      const out = audioCtx.createGain();
      out.gain.value = 0.9;
      out.connect(audioCtx.destination);

      // ① 「ピコ」：一瞬で1オクターブ駆け上がる短い音
      const blip = audioCtx.createOscillator();
      const bg   = audioCtx.createGain();
      blip.type = 'sine';
      blip.frequency.setValueAtTime(1046, t0);
      blip.frequency.exponentialRampToValueAtTime(2093, t0 + 0.07);
      bg.gain.setValueAtTime(0.0001, t0);
      bg.gain.exponentialRampToValueAtTime(0.32, t0 + 0.012);
      bg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
      blip.connect(bg); bg.connect(out);
      blip.start(t0); blip.stop(t0 + 0.25);

      // ② 「ーン」：澄んだ鐘のような余韻（倍音を重ねて硬い電子音にしない）
      [[2093, 0.26], [3136, 0.12], [4186, 0.05]].forEach(([freq, vol]) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t0 + 0.05);
        g.gain.exponentialRampToValueAtTime(vol, t0 + 0.09);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.15);
        o.connect(g); g.connect(out);
        o.start(t0 + 0.05); o.stop(t0 + 1.2);
      });
    } catch (e) {}
  };

  // 爆発時の音：短い電子音の連打ではなく、低く重い持続音（ドローン）を鳴らす。
  // iPadの小さいスピーカーは40Hz前後の基音をほとんど再生できないため、
  // ノコギリ波で倍音（82Hz/123Hz/164Hz…）を持たせ、低く聞こえるようにする。
  const DRONE_DUR = 14;   // 鳴り続ける長さ（秒）
  function startAlarm() {
    initAudio();
    if (!audioCtx) return;
    stopAlarm();
    try {
      const t0 = audioCtx.currentTime;
      const end = t0 + DRONE_DUR;
      const nodes = [];

      // 全体の音量エンベロープ：素早く立ち上げ、長く引き伸ばしてから減衰
      const out = audioCtx.createGain();
      out.gain.setValueAtTime(0.0001, t0);
      out.gain.exponentialRampToValueAtTime(0.85, t0 + 0.35);
      out.gain.setValueAtTime(0.85, end - 5);
      out.gain.exponentialRampToValueAtTime(0.0001, end);
      out.connect(audioCtx.destination);

      // 高い成分を削って暗く重い音にする。時間とともにさらに閉じていく
      const lp = audioCtx.createBiquadFilter();
      lp.type = 'lowpass'; lp.Q.value = 0.7;
      lp.frequency.setValueAtTime(550, t0);
      lp.frequency.exponentialRampToValueAtTime(180, end);
      lp.connect(out);

      // 基音をわずかにずらして重ね、うなりで不穏さを出す。
      // ゆっくり音程を下げて沈み込むような感じにする
      [[41, 'sawtooth', 0.30], [41.7, 'sawtooth', 0.26], [82, 'triangle', 0.15]]
        .forEach(([freq, type, vol]) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = type;
          o.frequency.setValueAtTime(freq, t0);
          o.frequency.exponentialRampToValueAtTime(freq * 0.82, end);
          g.gain.value = vol;
          o.connect(g); g.connect(lp);
          o.start(t0); o.stop(end + 0.1);
          nodes.push(o);
        });

      // ごく薄いノイズを混ぜ、単純なサイン波に聞こえないようにする
      const len = Math.floor(audioCtx.sampleRate * 2);
      const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const noise = audioCtx.createBufferSource();
      noise.buffer = buf; noise.loop = true;
      const nlp = audioCtx.createBiquadFilter();
      nlp.type = 'lowpass'; nlp.frequency.value = 180;
      const ng = audioCtx.createGain(); ng.gain.value = 0.10;
      noise.connect(nlp); nlp.connect(ng); ng.connect(out);
      noise.start(t0); noise.stop(end + 0.1);
      nodes.push(noise);

      // 数秒周期でフィルタを揺らし、一定すぎる音にならないようにする
      const lfo = audioCtx.createOscillator();
      const lfoGain = audioCtx.createGain();
      lfo.frequency.value = 0.22; lfoGain.gain.value = 70;
      lfo.connect(lfoGain); lfoGain.connect(lp.frequency);
      lfo.start(t0); lfo.stop(end + 0.1);
      nodes.push(lfo);

      droneNodes = { nodes, out };
    } catch(e) {}
  }
  function stopAlarm() {
    if (!droneNodes) return;
    const { nodes, out } = droneNodes;
    droneNodes = null;
    try {
      const t = audioCtx.currentTime;
      // ぶつ切りのノイズが出ないよう短くフェードしてから停止する
      out.gain.cancelScheduledValues(t);
      out.gain.setValueAtTime(Math.max(out.gain.value, 0.0001), t);
      out.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
      nodes.forEach(n => { try { n.stop(t + 0.3); } catch(e) {} });
    } catch(e) {}
  }

  // ──────────── Overlays ────────────
  const OVS = ['standby','confirm','checking','success','explosion'];

  function showOv(name) {
    OVS.forEach(n =>
      document.getElementById('ov-'+n).classList.toggle('show', n === name)
    );
    // Dots animation
    if (name === 'checking') {
      let i = 0;
      dotsLoop = setInterval(() => {
        document.getElementById('chk-dots').textContent = '.'.repeat((i%3)+1);
        i++;
      }, 300);
    } else {
      if (dotsLoop) { clearInterval(dotsLoop); dotsLoop = null; }
      document.getElementById('chk-dots').textContent = '...';
    }
  }

  // ──────────── Firebase connection status ────────────
  connRef.on('value', snap => {
    const connected = snap.val();
    const statusEl = document.getElementById('firebase-status');
    if (connected) {
      statusEl.classList.remove('disconnected');
      statusEl.classList.add('connected');
    } else {
      statusEl.classList.remove('connected');
      statusEl.classList.add('disconnected');
    }
  });

  // ──────────── Ambient glow ────────────
  function updateGlow() {
    const g = document.getElementById('ambient-glow');
    g.classList.remove('warn','danger');
    if      (timeRemaining <= 10) g.classList.add('danger');
    else if (timeRemaining <= 30) g.classList.add('warn');
  }
  function clearGlow() {
    document.getElementById('ambient-glow').classList.remove('warn','danger');
  }

  // ──────────── Timer ────────────
  function startTimer(secs) {
    stopTimer();
    timeRemaining = secs;
    renderTimer();
    timerInterval = setInterval(tick, 1000);
  }
  function stopTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  }
  function tick() {
    timeRemaining = Math.max(0, timeRemaining - 1);
    renderTimer();
    gameRef.update({ timeRemaining: Math.floor(timeRemaining) });
    updateGlow();
    if (timeRemaining <= 10 && timeRemaining > 0) {
      sndBeep();
      document.getElementById('timer').classList.add('blink');
    }
    if (timeRemaining <= 0) triggerExplosion();
  }
  function renderTimer() {
    const s = Math.max(0, Math.floor(timeRemaining));
    document.getElementById('timer').textContent =
      String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
  }

  // ──────────── Digit display ────────────
  function renderCode() {
    for (let i = 0; i < 4; i++) {
      const b = document.getElementById('d'+i);
      b.textContent = inputCode[i] || '';
      b.classList.toggle('filled', i < inputCode.length);
    }
  }
  function popDigit(i) {
    const b = document.getElementById('d'+i);
    b.classList.remove('pop');
    void b.offsetWidth; // reflow to restart animation
    b.classList.add('pop');
    setTimeout(() => b.classList.remove('pop'), 160);
  }

  // ──────────── Numpad ────────────
  document.querySelectorAll('.kbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      initAudio();
      if (isLocked || gameState !== 'running') return;
      sndClick();
      onKey(btn.dataset.v);
    });
    btn.addEventListener('contextmenu', e => e.preventDefault());
  });

  function onKey(v) {
    if (v === 'back') {
      if (!inputCode.length) return;
      inputCode = inputCode.slice(0, -1);
      renderCode();
    } else if (v === 'enter') {
      if (inputCode.length === 4) doConfirm();
    } else {
      if (inputCode.length >= 4) return;
      const idx = inputCode.length;
      inputCode += v;
      renderCode();
      popDigit(idx);
      // 4桁揃ったら自動で確認画面
      if (inputCode.length === 4) setTimeout(doConfirm, 180);
    }
  }

  // ──────────── Confirm ────────────
  function doConfirm() {
    if (isLocked || gameState !== 'running' || inputCode.length !== 4) return;
    isLocked = true;
    document.getElementById('cfm-code').textContent = inputCode;
    showOv('confirm');
  }

  // いいえ → 最後の1桁を消してやり直し（auto-confirm が再発火しないよう3桁に戻す）
  document.getElementById('btn-no').addEventListener('click', () => {
    initAudio();
    inputCode = inputCode.slice(0, -1);
    renderCode();
    isLocked = false;
    showOv(null);
  });

  // はい → CHECKING
  document.getElementById('btn-yes').addEventListener('click', () => {
    initAudio();
    const snap = inputCode; // 判定用にスナップショット保存
    stopTimer();            // タイマーを止めてから判定（「残り1秒でENT」仕様対応）
    gameRef.update({ state: 'checking' });
    showOv('checking');

    checkTimeout = setTimeout(() => {
      checkTimeout = null;
      if (gameState === 'idle') return;   // 確認中にスタッフがリセットした場合は判定しない
      if (snap === SECRET_CODE) {
        doSuccess();
      } else {
        doWrong();
      }
    }, 1500);
  });

  // ──────────── Wrong attempt ────────────
  // 誤答は1回で即爆発（＋10秒のペナルティ猶予・再入力は廃止）
  function doWrong() {
    if (gameState === 'idle') return;   // リセット済みなら無視
    wrongAttempts++;
    gameRef.update({ wrongAttempts });
    triggerExplosion();
  }

  // ──────────── Success ────────────
  function doSuccess() {
    if (gameState === 'idle') return;   // リセット済みなら無視
    stopTimer();
    isLocked = true; gameState = 'success';
    sndSuccess();

    const s = Math.max(0, Math.floor(timeRemaining));
    document.getElementById('suc-time').textContent =
      '残り時間：' + String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
    document.getElementById('timer').classList.remove('blink');
    document.getElementById('timer').classList.add('green');
    clearGlow();
    gameRef.update({ state: 'success', timeRemaining: s });
    showOv('success');
  }

  // ──────────── Explosion ────────────
  function triggerExplosion() {
    clearPendingTimers();
    stopTimer(); stopAlarm();
    isLocked = true; gameState = 'explosion';
    clearGlow();
    // explodedAt: 爆発した瞬間のサーバー時刻。複数のスタッフ画面が
    // それぞれの受信時刻ではなくこの共通の時刻を基準に演出を鳴らすため、
    // 端末間で爆発音の開始タイミングが揃う（この画面では使用しない）
    gameRef.update({ state: 'explosion', timeRemaining: 0,
                     explodedAt: firebase.database.ServerValue.TIMESTAMP });
    startAlarm();
    showOv('explosion');
  }

  // ──────────── Game lifecycle ────────────
  function startGame(secs, initWrong) {
    gameState = 'running'; isLocked = false;
    sucSoundDone = false;                 // 次の成功で成功音を鳴らせるように戻す
    wrongAttempts = initWrong || 0; inputCode = '';
    renderCode();
    document.getElementById('timer').classList.remove('blink','green');
    document.getElementById('warn-wrap').classList.toggle('show', wrongAttempts > 0);
    document.getElementById('wrong-indicator').classList.remove('show');
    clearGlow();
    showOv(null);
    startTimer(secs);
  }

  function resetGame() {
    clearPendingTimers();
    stopTimer(); stopAlarm();
    gameState = 'idle'; isLocked = false; inputCode = ''; wrongAttempts = 0;
    sucSoundDone = false;                 // 次のゲームに備えて戻す
    renderCode();
    document.getElementById('timer').textContent = '--:--';
    document.getElementById('timer').classList.remove('blink','green');
    document.getElementById('warn-wrap').classList.remove('show');
    document.getElementById('wrong-indicator').classList.remove('show');
    clearGlow();
    showOv('standby');
  }

  // ──────────── Firebase listener ────────────
  gameRef.on('value', snap => {
    const d = snap.val();

    // リセット or 初回ロード（idle）
    if (!d || d.state === 'idle') {
      if (gameState !== 'idle') resetGame();
      else showOv('standby');
      return;
    }

    // 爆弾iPadは起動 or リロード時のみFirebaseと同期
    // （ゲーム中は爆弾iPadがマスター）
    // 【改善】リロード時のリカバリーを強化
    if (gameState !== 'idle' && gameState !== 'success' && gameState !== 'explosion') return;

    switch (d.state) {
      case 'running':
        // timeRemaining を優先（リロード時のリカバリー対応）
        startGame(d.timeRemaining ?? d.timeLimit, d.wrongAttempts || 0);
        break;
      case 'checking':
        // 「確認中」にリロードした場合のリカバリー：入力をクリアして再開
        startGame(d.timeRemaining ?? d.timeLimit, d.wrongAttempts || 0);
        gameRef.update({ state: 'running' });
        break;
      case 'success':
        gameState = 'success'; isLocked = true;
        document.getElementById('timer').classList.add('green');
        showOv('success');
        break;
      case 'explosion':
        gameState = 'explosion'; isLocked = true;
        showOv('explosion');
        break;
    }
  });

  // 起動時
  showOv('standby');

} // end initGame
</script>
</body>
</html>
