<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>スタッフ操作</title>

  <!--
  ╔═══════════════════════════════════════════════════════════╗
  ║  セットアップ手順                                          ║
  ║                                                           ║
  ║  1. console.firebase.google.com でプロジェクトを作成       ║
  ║  2. Realtime Database を追加（テストモードで作成でOK）      ║
  ║  3. プロジェクトの設定 → firebaseConfig をコピー            ║
  ║  4. 下の firebaseConfig の中身を貼り付ける                 ║
  ║  5. bomb.html にも同じ firebaseConfig を貼り付ける          ║
  ║                                                           ║
  ║  GitHub Pages デプロイ手順                                 ║
  ║  1. GitHub で新しいリポジトリを作成                         ║
  ║  2. index.html と bomb.html をアップロード                  ║
  ║  3. Settings → Pages → Deploy from branch (main)           ║
  ║  4. スタッフ用: yoursite.github.io/repo/index.html         ║
  ║     爆弾iPad: yoursite.github.io/repo/bomb.html            ║
  ╚═══════════════════════════════════════════════════════════╝
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    /* ─── Tokens ─── */
    :root {
      --bg:     #050A05;
      --card:   #090F09;
      --bd:     #1C341C;
      --green:  #00CC44;
      --dim:    #3A5A3A;
      --mute:   #1A2A1A;
      --accent: #00FF66;
      --warn:   #FFAA00;
      --danger: #FF3333;
    }

    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--green);
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 28px 16px 52px;
    }

    /* ─── Header ─── */
    .hdr {
      width: 100%; max-width: 400px;
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 24px;
    }
    .hdr-line { flex: 1; height: 1px; background: var(--bd); }
    .hdr-txt  { font-size: 0.62rem; color: var(--dim); letter-spacing: 6px; white-space: nowrap; }

    /* ─── Card ─── */
    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 10px; padding: 18px;
      width: 100%; max-width: 400px;
      margin-bottom: 12px;
    }
    .card-lbl {
      font-size: 0.58rem; color: var(--dim);
      letter-spacing: 5px; margin-bottom: 14px;
    }

    /* ─── Player grid ─── */
    .pgrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .pbtn {
      background: transparent;
      border: 1px solid var(--mute);
      color: var(--dim);
      font-family: inherit;
      padding: 13px 0 10px;
      border-radius: 7px;
      cursor: pointer; touch-action: manipulation;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      transition: all 0.14s;
    }
    .pbtn .pc { font-size: 1rem; line-height: 1; }
    .pbtn .pt { font-size: 0.6rem; color: var(--mute); transition: color 0.14s; }
    .pbtn.sel {
      background: rgba(0,204,68,0.05);
      border-color: var(--accent);
      color: var(--accent);
    }
    .pbtn.sel .pt { color: rgba(0,204,68,0.4); }
    .pbtn:not(.sel):active { background: rgba(255,255,255,0.02); }

    /* ─── BGM card ─── */
    .bgm-fname {
      font-size: 0.58rem; color: var(--dim); text-align: center;
      margin-bottom: 12px; word-break: break-all; min-height: 1.2em;
    }
    .bgm-unlock-btn {
      display: block; width: 100%; text-align: center;
      padding: 11px 0; margin-bottom: 14px;
      font-family: inherit; font-size: 0.62rem; letter-spacing: 1px;
      background: transparent; border: 1px solid var(--mute); color: var(--dim);
      border-radius: 7px; cursor: pointer; touch-action: manipulation;
      transition: all 0.14s;
    }
    .bgm-unlock-btn:active { background: rgba(255,255,255,0.03); }
    .bgm-unlock-btn.done {
      border-color: var(--accent); color: var(--accent);
    }

    /* 爆発音の準備状況（本番前に各端末で確認するための表示） */
    .exp-status {
      text-align: center; font-size: 0.58rem; letter-spacing: 1px;
      color: var(--dim); margin: -8px 0 12px; min-height: 1.1em;
    }
    .exp-status.ok { color: var(--accent); }
    .exp-status.ng { color: var(--danger); }

    .bgm-vol-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 14px;
    }
    .bgm-vol-lbl { font-size: 0.6rem; color: var(--dim); letter-spacing: 2px; white-space: nowrap; }
    .bgm-vol-row input[type="range"] { flex: 1; accent-color: var(--green); }
    .bgm-vol-val { font-size: 0.6rem; color: var(--dim); width: 3.2em; text-align: right; }

    .bgm-test-row { display: none; gap: 6px; } /* 本番では非表示（?debug=1 で表示） */
    .bgm-test-btn {
      flex: 1; padding: 9px 0;
      font-family: inherit; font-size: 0.58rem; letter-spacing: 1px;
      background: transparent; border: 1px solid var(--mute); color: var(--dim);
      border-radius: 6px; cursor: pointer; touch-action: manipulation;
      transition: all 0.14s;
    }
    .bgm-test-btn:active { background: rgba(255,255,255,0.03); color: var(--accent); }

    .bgm-warn {
      text-align: center; font-size: 0.6rem; color: var(--warn);
      letter-spacing: 1px; margin-top: 10px; min-height: 1.1em;
    }

    /* ─── Start button ─── */
    #start-btn {
      width: 100%; max-width: 400px; padding: 17px;
      font-family: inherit; font-size: 1rem; letter-spacing: 8px;
      background: rgba(0,204,68,0.05);
      border: 1px solid var(--green);
      color: var(--green);
      border-radius: 10px;
      cursor: pointer; touch-action: manipulation;
      transition: all 0.14s;
      margin-bottom: 12px;
    }
    #start-btn:disabled {
      opacity: 0.16; cursor: default;
      border-color: var(--mute); color: var(--mute);
    }
    #start-btn:not(:disabled):active {
      background: rgba(0,204,68,0.12);
      transform: scale(0.98);
    }

    /* ─── Status card ─── */
    #status-card { display: none; }
    #status-card.show { display: block; }

    .live-timer {
      font-size: 3.2rem; letter-spacing: 5px; text-align: center;
      padding: 8px 0 4px;
      color: var(--warn);
      transition: color 0.4s;
    }
    .live-timer.red   { color: var(--danger); }
    .live-timer.green { color: var(--accent); }

    .sbadge {
      text-align: center; font-size: 0.76rem; letter-spacing: 3px;
      padding: 8px 12px; border-radius: 6px; margin-top: 8px;
    }
    .b-run { color:var(--warn);   background:rgba(255,170,0,0.05);  border:1px solid rgba(255,170,0,0.18); }
    .b-chk { color:#AAAAFF;       background:rgba(100,100,255,0.05);border:1px solid rgba(100,100,255,0.18);}
    .b-suc { color:var(--accent); background:rgba(0,255,100,0.05);  border:1px solid rgba(0,255,100,0.18); }
    .b-exp { color:var(--danger); background:rgba(255,50,50,0.05);  border:1px solid rgba(255,50,50,0.18); }

    .atmp-info {
      text-align: center; font-size: 0.66rem;
      color: #FF8800; letter-spacing: 2px;
      margin-top: 6px; min-height: 1.1em;
    }

    /* ─── Reset (double-tap confirm) ─── */
    #reset-btn {
      width: 100%; margin-top: 14px; padding: 11px;
      font-family: inherit; font-size: 0.7rem; letter-spacing: 4px;
      background: transparent;
      border: 1px solid var(--mute);
      color: var(--mute);
      border-radius: 7px;
      cursor: pointer; touch-action: manipulation;
      transition: all 0.14s;
    }
    #reset-btn.confirming {
      border-color: var(--danger); color: var(--danger);
      letter-spacing: 2px;
    }
    #reset-btn:active { opacity: 0.7; }

    /* auto-reset countdown line in status card */
    .ar-info {
      text-align: center; font-size: 0.66rem;
      color: var(--accent); letter-spacing: 2px;
      margin-top: 6px; min-height: 1.1em;
    }

    /* ─── Explosion countdown overlay ─── */
    /* 縦画面でもはみ出さないよう、幅と高さの小さい方を基準にサイズを決める */
    #exp-cd {
      position: fixed; inset: 0; z-index: 200;
      display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 2.5vh;
      background: rgba(5,10,5,0.97);
      padding: 16px;
    }
    #exp-cd.show { display: flex; }
    .exp-cd-lbl {
      font-size: 0.62rem; color: var(--dim);
      letter-spacing: 5px; text-align: center;
    }
    .exp-cd-num {
      font-family: inherit; line-height: 1;
      font-size: min(44vw, 38vh);
      color: var(--danger);
      text-shadow: 0 0 24px rgba(255,50,50,0.5), 0 0 70px rgba(255,50,50,0.2);
      text-align: center; white-space: nowrap; max-width: 100%;
    }
    .exp-cd-num.tick { animation: expTick 0.5s ease-out; }
    .exp-cd-num.fire {
      font-size: min(20vw, 14vh); letter-spacing: 2px;
      animation: expFire 0.5s ease-out;
    }
    @keyframes expTick { 0%{transform:scale(1.3);opacity:0.2} 100%{transform:scale(1);opacity:1} }
    @keyframes expFire { 0%{transform:scale(0.72);opacity:0} 55%{transform:scale(1.12);opacity:1} 100%{transform:scale(1);opacity:1} }
  </style>
</head>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
// ╔════════════════════════════════════════════════════╗
// ★ Firebase Config（bomb.html と同じものを貼り付け）  ★
// ╚════════════════════════════════════════════════════╝
const firebaseConfig = {
    apiKey: "AIzaSyDlvOh0Am1vQLC4RyrOpkmseu_nx4vF0kE",
    authDomain: "countdown-a04be.firebaseapp.com",
    databaseURL: "https://countdown-a04be-default-rtdb.firebaseio.com",
    projectId: "countdown-a04be",
    storageBucket: "countdown-a04be.firebasestorage.app",
    messagingSenderId: "724179810638",
    appId: "1:724179810638:web:b09efd4bd277f03f45861f",
    measurementId: "G-T2GPLE7CQG"
  };

// Config 未設定チェック
if (firebaseConfig.apiKey === "YOUR_API_KEY") {
  document.getElementById('start-btn').disabled = true;
  document.getElementById('start-btn').textContent = "Firebase 未設定";
} else {
  firebase.initializeApp(firebaseConfig);
  const gameRef = firebase.database().ref('game');
  initStaff(gameRef);
}

function initStaff(gameRef) {

  let selPlayers = null, selTime = null;
  let currentState = 'idle', prevState = 'idle';
  let uiLocked = false;   // 進行中UIロックの二重書き込みを防ぐ
  let lastData = null;    // visibilitychange復帰時の再描画用

  // ── 自動リセット（常時ON）──
  const AR_DELAY = 15;             // 成功/爆発から何秒後に待機へ戻すか
  let arTimer = null, arCountdownInt = null;
  const arInfo = document.getElementById('ar-info');

  function cancelAutoReset() {
    if (arTimer)        { clearTimeout(arTimer);         arTimer = null; }
    if (arCountdownInt) { clearInterval(arCountdownInt); arCountdownInt = null; }
    arInfo.textContent = '';
  }
  function startAutoReset() {
    cancelAutoReset();
    let remain = AR_DELAY;
    arInfo.textContent = `自動リセットまで ${remain}秒`;
    arCountdownInt = setInterval(() => {
      remain--;
      arInfo.textContent = remain > 0 ? `自動リセットまで ${remain}秒` : '';
    }, 1000);
    arTimer = setTimeout(performReset, AR_DELAY * 1000);
  }

  // ── BGM ──
  // 6分尺のBGMを想定しつつ、実際のファイル長から自動でオフセットを算出する。
  // 「残り時間 = 0」と「曲の終わり」が揃うよう、開始位置のみを補正する。
  // iPad Safariでの音切れ対策として、再生速度(playbackRate)は一切変更しない。
  // 音量フェードのみで演出し、JSタイマーも100ms以上の間隔に抑える。
  // BGM/爆発音は同じフォルダに置いた bgm.mp3 / explosion.mp3 を自動で読み込む。
  const FADE_IN_MS      = 5000; // ゲーム開始時のフェードイン
  const DUCK_MS          = 300;  // コード確認開始時、音量を落とすのにかける時間
  const RESUME_MS        = 400;  // 誤答後、音量を元に戻すのにかける時間
  const SUCCESS_FADE_MS  = 2000; // 解除成功時のフェードアウト
  const RAMP_STEP_MS     = 100;  // 音量ランプの更新間隔（これより短い間隔にはしない）

  const bgmAudio = new Audio();
  const expAudio = new Audio();
  bgmAudio.preload = 'auto';
  expAudio.preload = 'auto';
  let bgmActiveForRun = false;
  let bgmFadeInterval = null;

  const bgmFname     = document.getElementById('bgm-fname');
  const bgmVolSlider  = document.getElementById('bgm-vol');
  const bgmVolVal     = document.getElementById('bgm-vol-val');
  const bgmWarn       = document.getElementById('bgm-warn');

  // テスト用ボタンは誤操作防止のため本番では非表示（?debug=1 で表示）
  if (new URLSearchParams(location.search).get('debug') === '1') {
    document.getElementById('bgm-test-row').style.display = 'flex';
  }

  // iOS Safari対策：爆発音(expAudio)は一度もplay()されていない状態だと、
  // ゲーム進行中に自動的に呼んでも再生がブロックされる（Androidでは発生しない）。
  // bgmAudioはSTARTボタン経由の本物の再生で自然にアンロックされるため対象外。
  // ※以前は bgmAudio にも同じミュート再生→即停止のアンロックを行っていたが、
  //   複数の操作（初回タップ／ボタン／START）から重複して呼ばれると、
  //   後から解決した play() の pause() が「本物の再生」を止めてしまい、
  //   かつ volume の退避値が上書きされて 0 のまま固定される不具合があった。
  //   （BGM/爆発音が全端末で無音になっていた原因）
  //   このため expAudio 専用にし、二重実行を確実に防ぐ状態管理にする。
  let expUnlockState = 'idle'; // 'idle' | 'unlocking' | 'unlocked'

  // 本番の爆発音を再生している最中は、アンロックや準備運転の後始末（pause）が
  // 絶対に割り込まないようにするためのフラグ。
  // ★不具合の原因だった箇所：アンロックの play() は Promise で解決するため、
  //   解決が遅れて爆発の瞬間に重なると .then() 内の pause() が本物の再生を止め、
  //   要素が「一時停止のまま」残っていた。この状態でBluetoothスピーカーの
  //   再生ボタンを押すと、OSが一時停止中のメディアを再開するため
  //   「後から爆発音が鳴る」という症状になっていた。
  let expRealPlay = false;

  function unlockExplosionAudio(onResult) {
    if (!expAudio.src)                 { onResult && onResult(false); return; }
    if (expUnlockState === 'unlocking') return; // 二重実行防止
    if (expUnlockState === 'unlocked') { onResult && onResult(true); return; }

    expUnlockState = 'unlocking';
    expAudio.muted = true;               // volume は本番用に 1.0 のまま保つ
    Promise.resolve(expAudio.play()).then(() => {
      if (expRealPlay) {                 // 本再生が始まっていたら一切触らない
        expUnlockState = 'unlocked';
        onResult && onResult(true);
        return;
      }
      expAudio.pause();
      try { expAudio.currentTime = 0; } catch (e) {}
      expAudio.muted = false;
      expUnlockState = 'unlocked';
      startKeepAlive();                  // 経路を維持（Bluetoothのスタンバイ対策）
      console.log('[BGM] expAudio unlock: play() succeeded');
      setExpStatus('ready');
      onResult && onResult(true);
    }).catch(err => {
      if (!expRealPlay) expAudio.muted = false;
      expUnlockState = 'idle'; // 失敗時は次のタップで再試行できるように戻す
      console.warn('[BGM] expAudio unlock: play() failed —', err && err.name || err);
      setExpStatus('locked');
      onResult && onResult(false);
    });
  }
  // 画面のどこを最初に触っても自動でアンロックを試みる（保険。失敗しても再タップで再試行可）
  document.addEventListener('pointerdown', () => unlockExplosionAudio(), { passive: true });

  // 明示的に「有効化した」と分かるボタン（本番でも常時表示・各端末で最初に1回）
  const unlockBtn = document.getElementById('bgm-unlock-btn');
  unlockBtn.addEventListener('click', () => {
    unlockBtn.textContent = '🔊 確認中...';
    unlockExplosionAudio(success => {
      if (success) {
        unlockBtn.textContent = '🔊 有効になりました';
        unlockBtn.classList.add('done');
      } else {
        unlockBtn.textContent = '⚠ 有効化できませんでした（再タップ）';
        unlockBtn.classList.remove('done');
      }
    });
  });

  // 爆発音はブラウザで出せる最大音量で固定する（BGMのスライダーとは連動させない）。
  // explosion.mp3 はピークが 0.0 dBFS（音量の余裕なし）なので、volume は 1.0 が
  // 歪ませずに出せる上限。これ以上大きくするには機器側の音量を上げる。
  const EXP_VOL = 1.0;

  function currentVolume() { return bgmVolSlider.value / 100; }
  bgmAudio.volume = currentVolume();
  expAudio.volume = EXP_VOL;

  bgmVolSlider.addEventListener('input', () => {
    bgmVolVal.textContent = bgmVolSlider.value + '%';
    if (!bgmFadeInterval) bgmAudio.volume = currentVolume();
  });

  function bgmDuration() {
    return isFinite(bgmAudio.duration) ? bgmAudio.duration : 0;
  }
  function checkBgmLength() {
    const maxTime = 360; // 1人プレイ（6:00）が最長
    const dur = bgmDuration();
    if (dur && dur < maxTime) {
      const m = Math.floor(dur / 60), sec = Math.floor(dur % 60);
      bgmWarn.textContent =
        `⚠ BGMが${m}:${String(sec).padStart(2,'0')}と短いため、長い制限時間では最後まで再生できません`;
    } else {
      bgmWarn.textContent = '';
    }
  }

  // 画面を開いた時点で両方の音声を読み込んでおく（爆発の瞬間に読み込み待ちを起こさない）
  bgmAudio.src = 'bgm.mp3';
  expAudio.src = 'explosion.mp3';
  setExpStatus('loading');
  expAudio.load();
  expAudio.addEventListener('canplaythrough', () => {
    console.log('[BGM] 爆発音の読み込み完了 readyState=' + expAudio.readyState);
    if (expUnlockState === 'unlocked') setExpStatus('ready');
  }, { once: true });
  bgmAudio.addEventListener('loadedmetadata', () => {
    checkBgmLength();
    bgmFname.textContent = '🎵 BGM 読み込み完了';
  }, { once: true });
  bgmAudio.addEventListener('error', () => {
    bgmFname.textContent = '⚠ bgm.mp3 が見つかりません';
  }, { once: true });
  expAudio.addEventListener('error', () => {
    bgmWarn.textContent = '⚠ explosion.mp3 が見つかりません';
  }, { once: true });

  // テストボタン（各端末で一度再生しておくと、自動再生ブロックが解除される）
  document.getElementById('bgm-test-play').addEventListener('click', () => {
    if (!bgmAudio.src) return;
    bgmAudio.currentTime = 0;
    bgmAudio.play().catch(err => console.warn('[BGM] test bgmAudio play() failed:', err));
  });
  document.getElementById('bgm-test-exp').addEventListener('click', () => {
    if (!expAudio.src) return;
    expAudio.currentTime = 0;
    expAudio.play().catch(err => console.warn('[BGM] test expAudio play() failed:', err));
  });
  document.getElementById('bgm-test-stop').addEventListener('click', () => {
    bgmAudio.pause();
    expAudio.pause();
  });

  function stopFade() {
    if (bgmFadeInterval) { clearInterval(bgmFadeInterval); bgmFadeInterval = null; }
  }

  // 音量だけを目標値まで滑らかに変化させる（playbackRateは一切操作しない）。
  // 更新間隔は RAMP_STEP_MS（100ms）以上にして、iPad Safariでの負荷を抑える。
  function rampTo(targetVol, durationMs, onDone) {
    stopFade();
    const startVol = bgmAudio.volume;
    const steps = Math.max(2, Math.round(durationMs / RAMP_STEP_MS));
    let i = 0;
    bgmFadeInterval = setInterval(() => {
      i++;
      const t = Math.min(1, i / steps);
      bgmAudio.volume = startVol + (targetVol - startVol) * t;
      if (i >= steps) {
        clearInterval(bgmFadeInterval);
        bgmFadeInterval = null;
        bgmAudio.volume = targetVol;
        if (onDone) onDone();
      }
    }, durationMs / steps);
  }

  // 制限時間の残り分だけ、曲の終わりから逆算した位置で再生開始し、
  // 約5秒かけて音量をフェードイン（currentTimeを動かすのはここだけ＝ゲーム開始時の一度きり）
  function startBgmAt(remainingTime) {
    if (!bgmAudio.src) return;
    stopFade();
    bgmAudio.currentTime = Math.max(0, bgmDuration() - remainingTime);
    bgmAudio.volume = 0;
    Promise.resolve(bgmAudio.play()).then(() => {
      console.log('[BGM] bgmAudio play() succeeded (start)');
    }).catch(err => {
      console.warn('[BGM] bgmAudio play() failed (start):', err && err.name || err);
      bgmWarn.textContent = '⚠ 自動再生がブロックされました。「音声を有効化」ボタンを押してください';
    });
    rampTo(currentVolume(), FADE_IN_MS);
  }

  // コード確認開始：音量を落としてから一時停止
  function duckForChecking() {
    rampTo(0, DUCK_MS, () => bgmAudio.pause());
  }

  // 誤答で running に戻る瞬間：無音・一時停止の間に「残り時間 = 曲の終わりまでの
  // 位置」へ巻き戻し（＝タイマーの+10秒とBGMの位置を一致させる一度きりの操作）、
  // 音量だけを滑らかに戻しながら再開する
  function resumeFromChecking(remainingTime) {
    if (!bgmAudio.src) return;
    stopFade();
    bgmAudio.currentTime = Math.max(0, bgmDuration() - remainingTime);
    bgmAudio.volume = 0;
    Promise.resolve(bgmAudio.play()).then(() => {
      console.log('[BGM] bgmAudio play() succeeded (resume)');
    }).catch(err => console.warn('[BGM] bgmAudio play() failed (resume):', err && err.name || err));
    rampTo(currentVolume(), RESUME_MS);
  }

  function stopBgmImmediate() {
    stopFade();
    bgmAudio.pause();
    // ★currentTime = 0 への巻き戻しはここでは行わない。
    //   タイムアップ時はBGMが曲の終盤（6分近く）まで再生されており、その位置から
    //   先頭へシークすると 8MB のファイルを読み直すため、直後の爆発音の再生準備と
    //   競合していた（タイムアップ時だけ爆発音が鳴らない原因）。
    //   再生位置は次のゲーム開始時に startBgmAt() が必ず設定し直すので不要。
  }
  function fadeOutOnSuccess() {
    rampTo(0, SUCCESS_FADE_MS, () => {
      bgmAudio.pause();
      bgmAudio.currentTime = 0;
    });
  }
  // ── 爆発音を「確実に鳴らす」ための処理 ──────────────────────────
  // play() が解決しても実際に再生が始まっているとは限らないため、
  // 再生位置が進んでいることまで確認し、確認できるまで間隔をあけて再試行する。
  const EXP_RETRY_MS   = [150, 300, 500, 800, 1200, 1800];  // 失敗時の再試行間隔
  const EXP_VERIFY_MS  = 140;   // play() 後、実際に進んだか確認するまでの待ち
  let expPlayTimers = [];
  let expConfirmed  = false;

  function clearExpPlayTimers() {
    expPlayTimers.forEach(clearTimeout);
    expPlayTimers = [];
  }
  function explosionIsPlaying() {
    return !expAudio.paused && !expAudio.ended && expAudio.currentTime > 0;
  }

  function playExplosion() {
    if (!expAudio.src) return;
    clearExpPlayTimers();
    expRealPlay = true;    // 以後、アンロック等の後始末が割り込むのを禁止
    expConfirmed = false;
    attemptExplosion(0);
  }

  function attemptExplosion(i) {
    if (expConfirmed) return;
    if (explosionIsPlaying()) {              // 既に鳴っていれば頭出しし直さない
      expConfirmed = true; setExpStatus('played'); return;
    }
    expAudio.muted = false;
    expAudio.volume = EXP_VOL;
    try { expAudio.currentTime = 0; } catch (e) {}

    const retry = reason => {
      console.warn('[BGM] 爆発音が再生されていません（' + reason + '） 試行' + (i + 1));
      if (i + 1 < EXP_RETRY_MS.length) {
        expPlayTimers.push(setTimeout(() => attemptExplosion(i + 1), EXP_RETRY_MS[i]));
      } else {
        setExpStatus('fail');
        bgmWarn.textContent = '⚠ 爆発音を再生できませんでした。「音声を有効化」を押してください';
      }
    };

    Promise.resolve(expAudio.play()).then(() => {
      // play() の解決＝再生開始ではないので、少し後に本当に進んだか確認する
      expPlayTimers.push(setTimeout(() => {
        if (explosionIsPlaying()) {
          expConfirmed = true;
          setExpStatus('played');
          console.log('[BGM] 爆発音の再生を確認（試行' + (i + 1) + '）');
        } else {
          retry('play()は成功したが再生位置が進まない');
        }
      }, EXP_VERIFY_MS));
    }).catch(err => retry(err && err.name || err));
  }

  // カウントダウン開始と同時に、無音のまま一瞬だけ再生してオーディオ経路を起こす。
  // Bluetoothスピーカーは無音が続くとスタンバイに入り、次の音の出だしが
  // 切れる／鳴らないことがあるため、鳴らす2.4秒前に起こしておく。
  function primeExplosionAudio() {
    if (!expAudio.src || expRealPlay) return;
    if (explosionIsPlaying()) return;   // 既に鳴っている音には絶対に触らない
    expAudio.muted = true;
    Promise.resolve(expAudio.play()).then(() => {
      if (expRealPlay) return;             // 本再生が始まっていたら触らない
      expAudio.pause();
      try { expAudio.currentTime = 0; } catch (e) {}
      expAudio.muted = false;
    }).catch(() => { if (!expRealPlay) expAudio.muted = false; });
  }

  // ── Bluetooth対策のキープアライブ ──────────────────────────────
  // 完全な無音が続くとBluetoothスピーカーが省電力で切断・スタンバイし、
  // 次の音の頭が欠ける。人には聞こえない極小レベル(-70dB程度)の音を
  // 鳴らし続けて経路を保つ。?nokeepalive=1 で無効化できる。
  let keepAliveAudio = null;
  const keepAliveEnabled =
    new URLSearchParams(location.search).get('nokeepalive') !== '1';

  function makeQuietWav(sec, rate) {
    const n = sec * rate, size = 44 + n * 2;
    const buf = new ArrayBuffer(size), dv = new DataView(buf), u8 = new Uint8Array(buf);
    const put = (o, s) => { for (let i = 0; i < s.length; i++) u8[o + i] = s.charCodeAt(i); };
    put(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); put(8, 'WAVE'); put(12, 'fmt ');
    dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, rate, true); dv.setUint32(28, rate * 2, true);
    dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
    put(36, 'data'); dv.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) dv.setInt16(44 + i * 2, Math.round(Math.sin(2*Math.PI*50*i/rate) * 8), true);
    let s = ''; for (let i = 0; i < size; i++) s += String.fromCharCode(u8[i]);
    return 'data:audio/wav;base64,' + btoa(s);
  }

  function startKeepAlive() {
    if (!keepAliveEnabled || keepAliveAudio) return;
    try {
      keepAliveAudio = new Audio(makeQuietWav(1, 8000));
      keepAliveAudio.loop = true;
      keepAliveAudio.volume = 1;   // 音源そのものが極小レベルなので実質無音
      keepAliveAudio.play().then(() => console.log('[BGM] キープアライブ開始'))
        .catch(err => console.warn('[BGM] キープアライブ失敗:', err && err.name || err));
    } catch (e) { keepAliveAudio = null; }
  }

  // Bluetoothスピーカーの停止ボタン等でブラウザ側が勝手に一時停止されないようにする
  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('pause', () => {});
      navigator.mediaSession.setActionHandler('play',  () => {});
    } catch (e) {}
  }

  // 爆発音の準備状況を画面に表示（本番前に各端末で確認できるように）
  function setExpStatus(kind) {
    const el = document.getElementById('exp-status');
    if (!el) return;
    const map = {
      loading: ['⋯ 爆発音を読み込み中', ''],
      ready:   ['✓ 爆発音の準備完了', 'ok'],
      locked:  ['⚠ 「音声を有効化」を押してください', 'ng'],
      played:  ['✓ 爆発音を再生しました', 'ok'],
      fail:    ['⚠ 爆発音を再生できませんでした', 'ng'],
    };
    const [txt, cls] = map[kind] || ['', ''];
    el.textContent = txt;
    el.className = 'exp-status ' + cls;
  }

  // ── 爆発カウントダウン演出（スタッフ画面のみ）──
  // 爆発確定を0.0秒として、1.2秒間隔で 3→2→1→発射!! を表示する。
  // 「1」の表示（2.4秒）と同時に explosion.mp3 を先頭(0.0秒)から再生し、
  // その1.2秒後（爆発確定から3.6秒後）に「発射!!」へ切り替える。
  // ＝「発射!!」の表示と音源の1.2秒地点が一致する（音源長は約11.3秒）。
  const CD_STEP_MS = 1200;
  const CD_SEQ     = ['3','2','1'];
  const CD_HOLD_MS = 2 * CD_STEP_MS; // 「発射!!」を表示し続ける時間（この後オーバーレイを閉じる）
  let cdTimers = [];

  // ── 複数のスタッフ画面で爆発音の開始タイミングを揃えるための時刻同期 ──
  // Firebaseの配信遅延は端末ごとに違うため、「受信した瞬間」を基準にすると
  // 端末間で音がズレる。爆発時に爆弾側が書き込む explodedAt（サーバー時刻）を
  // 基準にして各ステップを予約することで、どの端末でも同じ瞬間に鳴る。
  // serverTimeOffset は端末の時計とサーバー時計のズレ（Firebaseが提供）。
  let serverTimeOffset = 0;
  let serverTimeReady  = false;   // 時計合わせが済んだか（STARTの基準に使う）
  firebase.database().ref('.info/serverTimeOffset').on('value', snap => {
    const v = snap.val();
    if (typeof v === 'number' && isFinite(v)) { serverTimeOffset = v; serverTimeReady = true; }
  });
  function serverNow() { return Date.now() + serverTimeOffset; }
  const CD_MAX_CATCHUP_MS = 3000;   // これ以上遅れて受信した場合は追いつきを打ち切る
  const cdOverlay = document.getElementById('exp-cd');
  const cdNum     = document.getElementById('exp-cd-num');

  // 保留中の切り替え・爆発音の再生予約をすべて取消（リセット時の誤発火と多重再生を防ぐ）
  function cancelExplosionCountdown() {
    cdTimers.forEach(clearTimeout);
    cdTimers = [];
    clearExpPlayTimers();     // 再試行の予約も止める
    expRealPlay = false;      // 次の爆発に備えてフラグを戻す（再生中の音は止めない）
    cdOverlay.classList.remove('show');
    cdNum.classList.remove('tick','fire');
    cdNum.textContent = '';
  }

  function setCdText(text, isFire) {
    cdNum.classList.remove('tick','fire');
    void cdNum.offsetWidth;            // reflow：毎回アニメーションを再生し直す
    cdNum.textContent = text;
    cdNum.classList.add(isFire ? 'fire' : 'tick');
  }

  // explodedAt（爆発した瞬間のサーバー時刻）を基準に各ステップを予約する。
  // 値が無い場合（古い爆弾画面など）は受信時刻を基準にする＝従来と同じ動作。
  function startExplosionCountdown(explodedAt) {
    cancelExplosionCountdown();        // 二重起動時も予約を必ず一度切る（爆発音の多重再生防止）
    cdOverlay.classList.add('show');

    // 爆発からの経過時間。受信が遅れた端末はこの分だけ前倒しで予約するので、
    // 結果としてどの端末でも同じ瞬間に「1」＋爆発音が来る
    let elapsed = 0;
    if (typeof explodedAt === 'number' && isFinite(explodedAt)) {
      const e = serverNow() - explodedAt;
      if (e > 0) elapsed = Math.min(e, CD_MAX_CATCHUP_MS);
    }

    // 予定時刻を既に過ぎているステップは即実行（遅れて受信しても表示が追いつく）
    const at = (offsetMs, fn) => {
      const delay = offsetMs - elapsed;
      if (delay <= 0) fn();
      else cdTimers.push(setTimeout(fn, delay));
    };

    const fireAt = (CD_SEQ.length - 1) * CD_STEP_MS;  // 2.4秒＝「1」
    // 鳴らす前にオーディオ経路を起こしておく（Bluetoothのスタンバイ対策）
    if (elapsed < fireAt) primeExplosionAudio();
    CD_SEQ.forEach((t, i) => at(i * CD_STEP_MS, () => setCdText(t, false)));
    at(fireAt, playExplosion);                                  // 爆発音の再生開始
    at(fireAt + CD_STEP_MS, () => setCdText('発射!!', true));     // 3.6秒
    // 「発射!!」を見せた後はオーバーレイを閉じ、既存のステータス表示
    // （自動リセットの残り秒数・RESETボタン）を操作できる状態に戻す
    at(fireAt + CD_STEP_MS + CD_HOLD_MS, () => cdOverlay.classList.remove('show'));
  }

  // 待機状態へ戻す（手動リセット2回目・自動リセットで共通）
  function performReset() {
    cancelAutoReset();
    cancelExplosionCountdown();
    stopBgmImmediate();
    bgmActiveForRun = false;
    uiLocked = false;
    gameRef.set({ state: 'idle' });
    document.getElementById('start-btn').disabled = true;
    document.getElementById('status-card').classList.remove('show');
    document.querySelectorAll('.pbtn').forEach(b => {
      b.classList.remove('sel');
      b.style.opacity = '1';
    });
    selPlayers = null; selTime = null;
  }

  // ── Player buttons ──
  document.querySelectorAll('.pbtn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.pbtn').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
      selPlayers = +b.dataset.p;
      selTime    = +b.dataset.t;
      document.getElementById('start-btn').disabled = false;
    });
  });

  // ── Start ──
  document.getElementById('start-btn').addEventListener('click', () => {
    if (!selTime) return;
    unlockExplosionAudio(); // 念のためここでも(保険)
    // 【重要】STARTを押したこの瞬間を、サーバー時計に換算してゲーム開始時刻にする。
    // ServerValue.TIMESTAMP だとサーバーに書き込みが届いた時刻（＝往復遅延の分だけ後）
    // になってしまうため、押した瞬間を基準にできるこちらを使う。
    // まだ時計合わせが済んでいない場合だけ ServerValue.TIMESTAMP にフォールバックする。
    const startAt = serverTimeReady
      ? serverNow()
      : firebase.database.ServerValue.TIMESTAMP;
    backupExplodeFired = false;
    gameRef.set({
      state:         'running',
      players:       selPlayers,
      timeLimit:     selTime,
      timeRemaining: selTime,
      wrongAttempts: 0,
      startAt:       startAt
    });
    document.getElementById('start-btn').disabled = true;
    document.querySelectorAll('.pbtn').forEach(b => b.style.opacity = '0.38');
    document.getElementById('status-card').classList.add('show');
  });

  // ── Reset（2回タップで確定、3秒でキャンセル）──
  let resetPending = false;
  let resetTimer   = null;
  const resetBtn   = document.getElementById('reset-btn');

  resetBtn.addEventListener('click', () => {
    if (!resetPending) {
      // 1回目: 確認状態へ
      resetPending = true;
      resetBtn.textContent = '[ もう一度押してリセット確定 ]';
      resetBtn.classList.add('confirming');
      resetTimer = setTimeout(() => {
        resetPending = false;
        resetBtn.textContent = '[ RESET ]';
        resetBtn.classList.remove('confirming');
      }, 3000);
      return;
    }
    // 2回目: 実行
    clearTimeout(resetTimer);
    resetPending = false;
    resetBtn.textContent = '[ RESET ]';
    resetBtn.classList.remove('confirming');
    performReset();
  });

  // ── 残り時間の計算（爆弾iPadと完全に同じ式・同じ基準時刻を使う） ──
  // 爆弾iPadが毎秒書き込む timeRemaining を表示に使うと「爆弾→サーバー→スタッフ」
  // の遅延が上乗せされるため、開始の絶対時刻から自分で計算する。
  function liveRemaining(d) {
    if (!d) return 0;
    // 終了後は確定値をそのまま出す
    if (d.state === 'success' || d.state === 'explosion') return Math.max(0, d.timeRemaining || 0);
    const limit = d.timeLimit || 0;
    // startAt が無い旧データは従来どおり timeRemaining を使う（互換維持）
    if (typeof d.startAt !== 'number' || !isFinite(d.startAt)) return Math.max(0, d.timeRemaining || 0);
    // 判定中は爆弾iPadが止めた時刻で固定する
    const now = (d.state === 'checking' && typeof d.checkingAt === 'number')
      ? d.checkingAt : serverNow();
    return Math.max(0, limit - (now - d.startAt) / 1000);
  }

  // 爆弾iPadがスリープ等で時間切れに気づけなかった場合の予備判定。
  // 爆弾iPad側に先に判定させるため、0到達から少し待ってから確定させる。
  const BACKUP_EXPLODE_DELAY_MS = 3000;
  let backupExplodeFired = false;
  function maybeBackupExplosion(d) {
    if (backupExplodeFired) return;
    if (typeof d.startAt !== 'number' || !isFinite(d.startAt)) return;
    const overMs = serverNow() - (d.startAt + (d.timeLimit || 0) * 1000);
    if (overMs < BACKUP_EXPLODE_DELAY_MS) return;
    backupExplodeFired = true;
    console.warn('[Timer] 爆弾iPadから時間切れの通知が来ないため、スタッフ画面側で確定させます');
    gameRef.update({ state: 'explosion', timeRemaining: 0,
                     explodedAt: firebase.database.ServerValue.TIMESTAMP });
  }

  // ミス回数など、Firebaseの値が変わったときだけ更新すればよい表示
  function renderVisuals(d) {
    document.getElementById('atmp-info').textContent = d.wrongAttempts > 0
      ? `⚠  ミス ${d.wrongAttempts}回目`
      : '';
  }

  // 残り時間の表示は自前のループで回す（Firebaseの受信間隔に依存させない）。
  // 画面が復帰した瞬間も、絶対時刻から計算し直すので即座に正しい値になる。
  function renderLiveTimer() {
    const d = lastData;
    if (!d || d.state === 'idle') return;
    const rem = liveRemaining(d);
    if (d.state === 'running' && rem <= 0) maybeBackupExplosion(d);
    if (document.hidden) return;   // 非表示中はDOM書き込みを止めてCPU負荷を抑える
    const s = Math.max(0, Math.ceil(rem));
    const timerEl = document.getElementById('live-timer');
    const txt = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
    if (timerEl.textContent !== txt) timerEl.textContent = txt;
    let cls = 'live-timer';
    if (d.state === 'running'   && s <= 30) cls += ' red';
    if (d.state === 'success')              cls += ' green';
    if (d.state === 'explosion')            cls += ' red';
    if (timerEl.className !== cls) timerEl.className = cls;
  }
  setInterval(renderLiveTimer, 50);    // 表示の遅れを50ms以内に抑える

  // タブ復帰時は最新状態で即座に描画し直す
  // （BGMの再生・同期はこれとは独立して常に継続する）
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && lastData && lastData.state !== 'idle') {
      renderVisuals(lastData);
      renderLiveTimer();
    }
  });

  // ── Firebase → status panel ──
  gameRef.on('value', snap => {
    const d = snap.val();
    if (!d || d.state === 'idle') {
      currentState = 'idle'; prevState = 'idle';
      uiLocked = false;
      lastData = null;
      cancelAutoReset();
      cancelExplosionCountdown();
      stopBgmImmediate();
      bgmActiveForRun = false;
      backupExplodeFired = false;   // 次のゲームに備えて予備の時間切れ判定を戻す
      document.getElementById('live-timer').textContent = '--:--';
      // 待機状態へ：操作を戻す(どの経路でリセットされても追従)
      document.getElementById('status-card').classList.remove('show');
      document.getElementById('start-btn').disabled = (selTime == null);
      document.querySelectorAll('.pbtn').forEach(b => b.style.opacity = '1');
      return;
    }

    currentState = d.state;
    lastData = d;

    // 進行中UIロックへの切り替えは最初の1回だけ(毎秒のDOM書き込みを避ける)
    if (!uiLocked) {
      document.getElementById('status-card').classList.add('show');
      document.getElementById('start-btn').disabled = true;
      document.querySelectorAll('.pbtn').forEach(b => b.style.opacity = '0.38');
      uiLocked = true;
    }

    if (!document.hidden) renderVisuals(d);

    // バッジ表示は状態が変わった時だけ更新
    if (d.state !== prevState) {
      const badgeEl = document.getElementById('sbadge');
      badgeEl.className = 'sbadge';
      switch (d.state) {
        case 'running':
          badgeEl.classList.add('b-run');
          badgeEl.textContent = '▶  ゲーム進行中';
          break;
        case 'checking':
          badgeEl.classList.add('b-chk');
          badgeEl.textContent = '⟳  コード確認中...';
          break;
        case 'success':
          badgeEl.classList.add('b-suc');
          badgeEl.textContent = '✓  解除成功！';
          break;
        case 'explosion':
          badgeEl.classList.add('b-exp');
          badgeEl.textContent = '💥  爆発！';
          break;
      }
    }

    // ── BGM制御(画面の表示状態に関わらず常に実行) ──
    if (d.state === 'running') {
      if (!bgmActiveForRun) {
        // BGMの頭出しも、受信した timeRemaining ではなく絶対時刻から計算した
        // 残り時間を使う（通信遅延の分だけ曲がズレるのを防ぐ）
        startBgmAt(liveRemaining(d));
        bgmActiveForRun = true;
      } else if (prevState === 'checking') {
        resumeFromChecking(liveRemaining(d));
      }
    } else if (d.state === 'checking') {
      if (bgmActiveForRun) duckForChecking();
    }

    // 終了（成功/爆発）へ切り替わった瞬間に自動リセットを予約（常時ON）
    const justEnded = (d.state === 'success' || d.state === 'explosion')
                   && prevState !== 'success' && prevState !== 'explosion';
    if (justEnded) {
      startAutoReset();
      if (d.state === 'success') {
        if (bgmActiveForRun) fadeOutOnSuccess();
      } else if (d.state === 'explosion') {
        stopBgmImmediate();
        // 爆発音は「1」表示（2.4秒）と同時。explodedAt を渡して端末間で時刻を揃える
        startExplosionCountdown(d.explodedAt);
      }
      bgmActiveForRun = false;
    }
    if (d.state === 'running' || d.state === 'checking') cancelAutoReset();

    prevState = d.state;
  });

} // end initStaff
</script>
</body>
</html>
